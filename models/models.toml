# Model manifest for the anime-illustration pipeline.
#
#   Download + verify:  python scripts/download_models.py --root <MODELS_ROOT>
#   Verify only:        python scripts/download_models.py --root <MODELS_ROOT> --check-only
#
# `file` is relative to the models root and is the filename the workflows expect
# (see extra_model_paths.yaml.example). Hugging Face entries download automatically;
# Civitai entries (url empty) need a free account and a manual download — the script
# still verifies their SHA-256.
#
# Hashes were computed from the files this repo was tested with. If an upstream file
# changes, the hash check will catch it.

